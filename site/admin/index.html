<!doctype html>
<html lang="uk">

    <meta charset="utf-8" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://*.githubusercontent.com; media-src blob:; frame-src blob:; worker-src blob:; manifest-src blob:; connect-src 'self' blob: data: https://unpkg.com https://api.github.com https://www.githubstatus.com https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'"

    <script
      src="https://unpkg.com/@sveltia/cms@0.253.1/dist/sveltia-cms.js"
